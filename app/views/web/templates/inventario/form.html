{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if moto else 'Agregar' }} Motocicleta — Elián-Liam Motors CR{% endblock %}
{% block contenido %}
<h1>{{ 'Editar' if moto else 'Agregar' }} Motocicleta</h1>
<div class="tarjeta">
<form class="formulario" method="post">
    <div class="campo">
        <label for="marca">Marca</label>
        <input type="text" id="marca" name="marca" value="{{ valores.get('marca', '') if valores else '' }}" required>
    </div>
    <div class="campo">
        <label for="modelo">Modelo</label>
        <input type="text" id="modelo" name="modelo" value="{{ valores.get('modelo', '') if valores else '' }}" required>
    </div>
    <div class="campo">
        <label for="anio">Año</label>
        <input type="number" id="anio" name="anio" value="{{ valores.get('anio', '') if valores else '' }}" required>
    </div>
    <div class="campo">
        <label for="color">Color</label>
        <input type="text" id="color" name="color" value="{{ valores.get('color', '') if valores else '' }}">
    </div>
    <div class="campo">
        <label for="cilindraje">Cilindraje (cc)</label>
        <input type="number" id="cilindraje" name="cilindraje" value="{{ valores.get('cilindraje', '') if valores else '' }}" required>
    </div>
    <div class="campo">
        <label for="vin">Número de chasis / VIN</label>
        {% if moto %}
        <input type="text" value="{{ moto['vin'] }}" disabled>
        {% else %}
        <input type="text" id="vin" name="vin" value="{{ valores.get('vin', '') if valores else '' }}" required>
        {% endif %}
    </div>
    <div class="campo">
        <label for="precio">Precio</label>
        <input type="number" step="0.01" id="precio" name="precio" value="{{ valores.get('precio', '') if valores else '' }}" required>
    </div>
    <div>
        <button type="submit" class="btn">Guardar</button>
        <a class="btn btn-secundario" href="{{ url_for('inventario.listar') }}">Cancelar</a>
    </div>
</form>
</div>
{% endblock %}
