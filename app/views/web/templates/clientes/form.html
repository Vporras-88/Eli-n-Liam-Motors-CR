{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if cliente else 'Agregar' }} Cliente — Elián-Liam Motors CR{% endblock %}
{% block contenido %}
<h1>{{ 'Editar' if cliente else 'Agregar' }} Cliente</h1>
<div class="tarjeta">
<form class="formulario" method="post">
    <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" value="{{ valores.get('nombre', '') if valores else '' }}" required>
    </div>
    <div class="campo">
        <label for="cedula">Cédula</label>
        {% if cliente %}
        <input type="text" value="{{ cliente['cedula'] }}" disabled>
        {% else %}
        <input type="text" id="cedula" name="cedula" value="{{ valores.get('cedula', '') if valores else '' }}" required>
        {% endif %}
    </div>
    <div class="campo">
        <label for="telefono">Teléfono (0000-0000)</label>
        <input type="text" id="telefono" name="telefono" value="{{ valores.get('telefono', '') if valores else '' }}">
    </div>
    <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ valores.get('email', '') if valores else '' }}">
    </div>
    <div class="campo">
        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" name="direccion" value="{{ valores.get('direccion', '') if valores else '' }}">
    </div>
    <div class="campo">
        <label for="financiera_id">Financiera</label>
        <div style="display:flex;gap:0.4rem;">
            <select id="financiera_id" name="financiera_id" style="flex:1;">
                <option value="">— Ninguna —</option>
                {% for f in financieras %}
                <option value="{{ f['id'] }}" {{ 'selected' if valores.get('financiera_id')|string == f['id']|string else '' }}>{{ f['nombre'] }}</option>
                {% endfor %}
            </select>
            <a class="btn btn-secundario btn-pequeno" href="{{ url_for('clientes.financieras') }}" target="_blank" title="Agregar una nueva financiera en una pestaña aparte">+ Nueva</a>
        </div>
    </div>
    <div class="campo">
        <label for="estado_financiamiento">Estado del financiamiento</label>
        <select id="estado_financiamiento" name="estado_financiamiento">
            <option value="" {{ 'selected' if not valores.get('estado_financiamiento') else '' }}>— Sin definir —</option>
            <option value="pendiente" {{ 'selected' if valores.get('estado_financiamiento') == 'pendiente' else '' }}>Pendiente</option>
            <option value="aprobado" {{ 'selected' if valores.get('estado_financiamiento') == 'aprobado' else '' }}>Aprobado</option>
            <option value="rechazado" {{ 'selected' if valores.get('estado_financiamiento') == 'rechazado' else '' }}>Rechazado</option>
        </select>
    </div>
    <div>
        <button type="submit" class="btn">Guardar</button>
        <a class="btn btn-secundario" href="{{ url_for('clientes.listar') }}">Cancelar</a>
    </div>
</form>
</div>
{% endblock %}
