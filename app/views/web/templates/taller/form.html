{% extends "base.html" %}
{% block titulo %}Nueva Orden de Trabajo — Elián-Liam Motors CR{% endblock %}
{% block contenido %}
<h1>Nueva Orden de Trabajo</h1>
<div class="tarjeta">
<form class="formulario" method="post">
    <div class="campo">
        <label for="cliente_id">Cliente</label>
        <select id="cliente_id" name="cliente_id" required>
            <option value="">— Seleccione —</option>
            {% for c in clientes %}
            <option value="{{ c['id'] }}" {{ 'selected' if valores.get('cliente_id')|string == c['id']|string else '' }}>{{ c['nombre'] }} ({{ c['cedula'] }})</option>
            {% endfor %}
        </select>
    </div>
    <div class="campo">
        <label for="moto_marca">Marca de la moto</label>
        <input type="text" id="moto_marca" name="moto_marca" value="{{ valores.get('moto_marca', '') }}" required>
    </div>
    <div class="campo">
        <label for="moto_modelo">Modelo de la moto</label>
        <input type="text" id="moto_modelo" name="moto_modelo" value="{{ valores.get('moto_modelo', '') }}" required>
    </div>
    <div class="campo">
        <label for="moto_placa">Placa</label>
        <input type="text" id="moto_placa" name="moto_placa" value="{{ valores.get('moto_placa', '') }}">
    </div>
    <div class="campo">
        <label for="mecanico_id">Mecánico asignado</label>
        <select id="mecanico_id" name="mecanico_id">
            <option value="">— Sin asignar —</option>
            {% for m in mecanicos %}
            <option value="{{ m['id'] }}" {{ 'selected' if valores.get('mecanico_id')|string == m['id']|string else '' }}>{{ m['nombre'] }}</option>
            {% endfor %}
        </select>
        {% if not mecanicos %}<small>No hay mecánicos registrados todavía.</small>{% endif %}
    </div>
    <div class="campo">
        <label for="descripcion_problema">Descripción del problema</label>
        <textarea id="descripcion_problema" name="descripcion_problema" rows="3" required>{{ valores.get('descripcion_problema', '') }}</textarea>
    </div>
    <div class="campo">
        <label for="costo_mano_obra">Costo de mano de obra</label>
        <div style="display:flex;gap:0.4rem;">
            <input type="number" step="0.01" id="costo_mano_obra" name="costo_mano_obra" value="{{ valores.get('costo_mano_obra', '') }}" required style="flex:1;">
            <select name="moneda_mano_obra" style="flex:0 0 auto;">
                {% for cod, etiqueta in MONEDAS.items() %}
                <option value="{{ cod }}" {{ 'selected' if valores.get('moneda_mano_obra', 'CRC') == cod else '' }}>{{ etiqueta }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div>
        <button type="submit" class="btn">Crear orden</button>
        <a class="btn btn-secundario" href="{{ url_for('taller.listar') }}">Cancelar</a>
    </div>
</form>
</div>
{% endblock %}
