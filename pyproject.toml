[project]
name = "eli-liam-motors"
version = "0.1.0"
description = "Sistema de gestión para Elián-Liam Motors CR: inventario de motocicletas, clientes, ventas, repuestos/accesorios y taller mecánico."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.9",
    "bcrypt>=4.2",
    "flask>=3.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
